{% extends "base.html" %}

{% block head_title %}Dashboard - {{ block.super }}{% endblock %}

{% block content %}
  <main class="mx-auto max-w-screen-xl px-4 py-10">
    <div class="mb-8 flex items-center justify-between">
      <div>
        <p class="text-sm font-medium text-blue-700">DEMO DASHBOARD</p>
        <h1 class="mt-1 text-3xl font-bold text-gray-900 dark:text-white">Welcome back, {{ request.user.username|default:"there" }}</h1>
      </div>
      <a class="rounded-lg bg-blue-700 px-4 py-2 text-sm font-medium text-white hover:bg-blue-800" href="{% url 'account_logout' %}">Log out</a>
    </div>

    <section class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
      <article class="rounded-lg border border-gray-200 bg-white p-6 shadow-sm dark:border-gray-700 dark:bg-gray-800">
        <p class="text-sm text-gray-500 dark:text-gray-400">Account status</p>
        <p class="mt-2 text-2xl font-semibold text-gray-900 dark:text-white">Active</p>
      </article>
      <article class="rounded-lg border border-gray-200 bg-white p-6 shadow-sm dark:border-gray-700 dark:bg-gray-800">
        <p class="text-sm text-gray-500 dark:text-gray-400">Projects</p>
        <p class="mt-2 text-2xl font-semibold text-gray-900 dark:text-white">0</p>
      </article>
      <article class="rounded-lg border border-gray-200 bg-white p-6 shadow-sm dark:border-gray-700 dark:bg-gray-800">
        <p class="text-sm text-gray-500 dark:text-gray-400">Next step</p>
        <p class="mt-2 text-2xl font-semibold text-gray-900 dark:text-white">Create a project</p>
      </article>
    </section>
  </main>
{% endblock %}
