<nav class="border-b border-gray-200 bg-white dark:border-gray-700 dark:bg-gray-800">
  <div class="mx-auto flex max-w-screen-xl items-center justify-between px-4 py-4">

    <ul class="flex items-center gap-4 text-sm font-medium">
      <li><a class="text-gray-700 hover:text-blue-700 dark:text-gray-200 dark:hover:text-blue-400" href="{% url 'home' %}">Home</a></li>

          <svg class="col-start-1 row-start-1 h-5 w-5 dark:hidden" aria-hidden="true" fill="none" viewBox="-1 -1 26 26" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364-.707-.707M6.343 6.343l-.707-.707m12.728 0-.707.707M6.343 17.657l-.707.707M12 16a4 4 0 100-8 4 4 0 000 8z"/></svg>
          <svg class="col-start-1 row-start-1 hidden h-5 w-5 dark:block" aria-hidden="true" fill="none" viewBox="-1 -1 26 26" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3a6 6 0 009 9 9 9 0 11-9-9z"/></svg>
        </button>
      </li>
      {% if request.user.is_authenticated %}
        <li class="relative">
          <button id="user-menu-button" data-dropdown-toggle="user-menu" type="button" class="inline-flex items-center gap-2 rounded-lg border border-gray-300 bg-white px-3 py-2 text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-4 focus:ring-blue-100 dark:border-gray-600 dark:bg-gray-700 dark:text-gray-200 dark:hover:bg-gray-600 dark:focus:ring-gray-600">
            {{ request.user.username|default:"Account" }}
            <svg class="h-4 w-4" aria-hidden="true" fill="none" viewBox="0 0 10 6"><path d="m1 1 4 4 4-4" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/></svg>
